<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browser Copilot Agent</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Local Browser Agent</p>
        <h1>Browser Copilot</h1>
        <p class="subtitle">搜索、推荐、读视频，并持续观察当前标签页。</p>
      </div>
      <div class="status-stack">
        <span id="statusBadge" class="status-badge idle">Idle</span>
        <span id="modelBadge" class="model-badge">model pending</span>
      </div>
    </header>

    <section class="composer card-surface">
      <label for="goal">任务目标</label>
      <textarea id="goal" rows="4" placeholder="例如：预算1000元以内，帮我推荐通勤降噪耳机并比较证据"></textarea>

      <div class="quick-grid" aria-label="快捷任务">
        <button type="button" class="quick-chip" data-goal="帮我找几个可以参考的浏览器自动化智能体 GitHub 开源项目，比较活跃度、语言、README质量和适合借鉴的实现点" data-url="https://github.com">GitHub 调研</button>
        <button type="button" class="quick-chip" data-goal="预算1000元以内，推荐一款适合通勤和办公室使用的降噪耳机，要比较品牌、类型、价格、音质、降噪、佩戴舒适度和用户评价" data-url="https://www.bing.com">商品推荐</button>
        <button type="button" class="quick-chip" data-goal="帮我查找并整理一个 CLIP 多模态模型入门教程视频的主要内容" data-url="https://www.bing.com">视频整理</button>
      </div>

      <details class="advanced">
        <summary>运行设置</summary>
        <div class="field-row">
          <label for="url">起始 URL</label>
          <input id="url" value="https://example.com" />
        </div>
        <div class="field-row">
          <label for="domain">任务场景</label>
          <select id="domain">
            <option value="auto">自动识别</option>
            <option value="shopping">商品推荐</option>
            <option value="github">GitHub 调研</option>
            <option value="paper">论文调研</option>
            <option value="video">视频整理</option>
            <option value="general">通用调研</option>
          </select>
        </div>
        <div class="field-row compact-row">
          <label for="maxSteps">最大步数</label>
          <input id="maxSteps" type="number" min="1" max="30" value="10" />
        </div>
        <div class="field-row">
          <label for="apiBase">后端地址</label>
          <input id="apiBase" value="http://127.0.0.1:8000" />
        </div>
        <p id="configStatus" class="config-status">正在读取本地后端配置...</p>
      </details>

      <button id="runBtn" class="run-button">运行并控制当前标签页</button>
      <p id="status" class="status-text">空闲，等待任务。</p>
    </section>

    <section class="report-toolbar">
      <span>Agent Report</span>
      <a id="markdownLink" href="http://127.0.0.1:8000/api/latest-report" target="_blank" rel="noreferrer">Markdown</a>
    </section>

    <section id="result" class="report">
      <p class="empty">运行后会在这里显示摘要、推荐、证据和浏览器监视轨迹。</p>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
