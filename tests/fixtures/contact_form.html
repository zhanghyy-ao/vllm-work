<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Contact Us</title>
  </head>
  <body>
    <main>
      <h1>联系项目团队</h1>
      <form>
        <label for="full-name">Full name</label>
        <input id="full-name" name="name" placeholder="Your name" />
        <label for="email">Email address</label>
        <input id="email" name="email" placeholder="you@example.com" />
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="How can we help?"></textarea>
        <button type="submit" aria-label="Submit contact form">Submit</button>
      </form>
    </main>
  </body>
</html>
